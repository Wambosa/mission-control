savePrefix: ""

# Never resolve a version published less than 7 days ago (value is in minutes).
# A worm's compromised release is usually yanked well inside that window, so
# waiting it out keeps a fresh resolve from picking one up.
minimumReleaseAge: 10080

overrides:
  "@esbuild-kit/core-utils@3.3.2>esbuild": 0.28.1
  "esbuild": 0.28.1
  "lodash-es": 4.18.1
  "protobufjs@8.0.1": 8.0.2
  "shell-quote": ">=1.8.5"
  "tmp": ">=0.2.7"
  "undici": ">=7.28.0"
  "ws": ">=8.21.0"
  "form-data": ">=4.0.6"
  "vite": ">=8.0.16"
  "axios@>=1.15.2 <1.18.0": ">=1.18.0"
  "brace-expansion@1": ">=1.1.16 <2"
  "brace-expansion@2": ">=2.1.2 <3"
  "brace-expansion@5": ">=5.0.7 <6"
  "fast-uri@>=3.0.0 <=3.1.3": ">=3.1.4"
  "js-yaml@>=4.0.0 <4.3.0": ">=4.3.0"
  "tar@<=7.5.18": ">=7.5.19"
  # Keep a single CodeMirror state/view copy so language extensions pass
  # instanceof checks (duplicate copies crash the file editor).
  "@codemirror/state": "6.7.0"
  "@codemirror/view": "6.43.0"
  # Keep a single node-pty copy, at the version disposePty() documents as the
  # floor. @agentsystemlabs/mission-control-agent pins 1.1.0, which leaks two
  # fds on every macOS spawn — the exhaustion this fork already fixed by moving
  # to 1.2.0-beta.14 (see electron/pty-manager.ts). Two copies also load two
  # pty.node images into one process, and electron-rebuild only ever touches
  # the top-level one; the 1.1.0 image is what aborted out of its
  # ThreadSafeFunction teardown on 2026-09-04.
  "node-pty": "1.2.0-beta.14"

allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: false
  esbuild: true
  node-pty: true
  protobufjs: true
  puppeteer: true
